<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
<rect width="1200" height="630" fill="#2544fe"/>
<g font-family="DejaVu Sans Mono,monospace" fill="white">
<text x="58" y="63" font-size="15" fill="#c9d1ff">SAI SURBEHERA / MUSINGS</text>
<text x="55" y="208" font-size="60" fill="#fff">Reflexivity</text><text x="55" y="290" font-size="60" fill="#fff">maxxing.</text>
<text x="58" y="373" font-size="22" fill="#e2e7ff">The chariot stayed still.</text><text x="58" y="410" font-size="22" fill="#f1fa8c">The archer changed.</text>
<text x="58" y="568" font-size="15" fill="#c9d1ff">AFTER BHAGAVAD GITA 18.73</text>
<rect x="704" y="111" width="444" height="438" rx="3" fill="#12172a" stroke="#7385ff"/><text x="730" y="148" font-size="15" fill="#f1fa8c">A CHANGE IN THE PERSON ACTING</text><path d="M852 232 C971 169 1102 271 1036 384 M1007 419 C863 496 761 375 816 273" fill="none" stroke="#7385ff" stroke-width="2"/><path d="M1024 365 L1036 386 L1057 374 M800 283 L816 270 L828 291" fill="none" stroke="#f1fa8c" stroke-width="2"/><text x="767" y="244" font-size="22" fill="#fff">NOTICE</text><text x="984" y="326" font-size="22" fill="#fff">REFLECT</text><text x="862" y="429" font-size="22" fill="#f1fa8c">ACT</text><text x="730" y="505" font-size="17" fill="#e2e7ff">“I remember. I will act.”</text>
</g></svg>